[workspace]
members = ["crates/mindchat-core"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/mindchat/mindchat"
rust-version = "1.88"

# Patched tokio-xmpp 6.0.0: authentication failures are terminal instead of
# retrying forever, and cancelled connection tasks stop retrying promptly.
[patch.crates-io]
tokio-xmpp = { path = "vendor/tokio-xmpp" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
