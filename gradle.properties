# Release build (ROADMAP 6.4): R8 full mode makes shrinking more aggressive
# (removes unused enum values, fields, etc.); the app's keep rules in
# app/proguard-rules.pro are written against it. Keep it on for every build
# so local release runs match CI.
android.enableR8.fullMode=true
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
kotlin.code.style=official
