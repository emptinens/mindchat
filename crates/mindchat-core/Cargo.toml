[package]
name = "mindchat-core"
version = "0.1.0"
description = "Typed domain core for the MindChat Android XMPP client"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
# Exposes the stable Kotlin/Android DTO contract through UniFFI.
uniffi = ["dep:uniffi"]

[dependencies]
uniffi = { version = "0.32.0", default-features = false, optional = true }

[lints]
workspace = true
