[package]
name = "mindchat-core"
version = "0.1.5"
description = "Typed domain core for the MindChat Android XMPP client"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["xmpp-transport"]
# Exposes the stable Kotlin/Android DTO contract through UniFFI.
uniffi = ["dep:uniffi", "xmpp-transport"]
# Builds the concrete Tokio/XMPP implementation behind the domain-safe
# `XmppTransport` trait. It is enabled in production builds but can be
# disabled for small, pure-state consumers.
xmpp-transport = ["dep:futures", "dep:hickory-resolver", "dep:tokio", "dep:tokio-xmpp", "dep:xmpp-parsers"]
# Builds opt-in integration tests that exercise the concrete network
# transport. Keep this separate from `xmpp-transport` so a pure core build
# with `--no-default-features` remains self-contained.
live-login-tests = ["xmpp-transport"]

[dependencies]
# Compile-time zero-log kill switch: these features make every `log::*`/
# `tracing::*` call site in the transitive tree (rustls, hickory, vendor)
# compile to nothing in both debug and release builds. They are direct deps
# so feature unification is guaranteed.
log = { version = "0.4", features = ["max_level_off", "release_max_level_off"] }
tracing = { version = "0.1", default-features = false, features = ["max_level_off", "release_max_level_off"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# RFC 7617 Basic scheme for HTTP CONNECT proxy authentication (ROADMAP 6.3).
# Cached 0.22.1.
base64 = "0.22.1"
futures = { version = "0.3.31", optional = true }
hickory-resolver = { version = "0.26.1", optional = true }
# io-util provides AsyncReadExt/AsyncWriteExt/AsyncBufReadExt for the proxy
# handshakes (read_exact/read_until/write_all) and tokio::io::BufReader for
# buffering the tunneled stream.
tokio = { version = "1.48.0", features = ["io-util", "net", "rt", "sync", "time"], optional = true }
tokio-xmpp = { version = "6.0.0", default-features = false, features = ["direct-tls", "preconnected", "ring", "starttls", "webpki-roots"], optional = true }
uniffi = { version = "0.32.0", default-features = false, optional = true }
xmpp-parsers = { version = "0.23.0", optional = true }

[dev-dependencies]

[[test]]
name = "live_login"
required-features = ["live-login-tests"]

[lints]
workspace = true

[[test]]
name = "live_ffi"
required-features = ["live-login-tests", "uniffi"]

[[test]]
name = "live_register"
required-features = ["live-login-tests", "uniffi"]
