[package]
name = "mindchat-core"
version = "0.1.4"
description = "Typed domain core for the MindChat Android XMPP client"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["xmpp-transport"]
# Exposes the stable Kotlin/Android DTO contract through UniFFI.
uniffi = ["dep:uniffi", "xmpp-transport"]
# Builds the concrete Tokio/XMPP implementation behind the domain-safe
# `XmppTransport` trait. It is enabled in production builds but can be
# disabled for small, pure-state consumers.
xmpp-transport = ["dep:futures", "dep:hickory-resolver", "dep:tokio", "dep:tokio-xmpp", "dep:xmpp-parsers"]
# Builds opt-in integration tests that exercise the concrete network
# transport. Keep this separate from `xmpp-transport` so a pure core build
# with `--no-default-features` remains self-contained.
live-login-tests = ["xmpp-transport"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = { version = "0.3.31", optional = true }
hickory-resolver = { version = "0.26.1", optional = true }
tokio = { version = "1.48.0", features = ["net", "rt", "sync", "time"], optional = true }
tokio-xmpp = { version = "6.0.0", default-features = false, features = ["direct-tls", "ring", "starttls", "webpki-roots"], optional = true }
uniffi = { version = "0.32.0", default-features = false, optional = true }
xmpp-parsers = { version = "0.23.0", optional = true }

[dev-dependencies]
env_logger = "0.11"

[[test]]
name = "live_login"
required-features = ["live-login-tests"]

[lints]
workspace = true

[[test]]
name = "live_ffi"
required-features = ["live-login-tests", "uniffi"]

[[test]]
name = "live_register"
required-features = ["live-login-tests", "uniffi"]
