name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo test --workspace --no-default-features

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - run: yes | sdkmanager --licenses >/dev/null
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"
      - run: cargo install cargo-ndk --version 4.1.2 --locked && cargo install uniffi --version 0.32.0 --features cli --locked
      - run: chmod +x gradlew scripts/build-rust-android.sh scripts/generate-uniffi-kotlin.sh scripts/verify-release.sh
      # Debug path (unit tests, lint, androidTest compile) plus the release
      # path (R8 minify on, lintVital, release unit tests) in one pass. The
      # keep rules in app/proguard-rules.pro are exercised for real here.
      - run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:compileDebugAndroidTestKotlin :app:assembleDebug :app:testReleaseUnitTest :app:lintVitalRelease :app:assembleRelease --no-daemon --max-workers=2
      # Hard release gates (ROADMAP 6.4): APK size budgets, v2 signature,
      # keep-rule audit, exported-symbol count after llvm-strip, hashes.
      - run: bash scripts/verify-release.sh --strict
      # Ship the freshly built native libraries to the zero-log job, which
      # runs `strings` over them. The authoritative .so is built here (the
      # host has the NDK; local hosts without one skip native assembly).
      - uses: actions/upload-artifact@v4
        with:
          name: jniLibs
          path: app/build/generated/jniLibs
          if-no-files-found: error

  zero-log:
    # The .so strings pass is only meaningful against the libraries the
    # android job just built, so this job consumes its jniLibs artifact
    # (--strict-so is therefore safe: a missing artifact is a hard failure).
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      # Warm the cargo registry from Cargo.lock so the --cargo-tree check
      # below can run offline on a fresh runner.
      - run: cargo fetch --locked
      - uses: actions/download-artifact@v4
        with:
          name: jniLibs
          path: jniLibs
      - run: bash scripts/check-zero-log.sh --strict-so --so-dir jniLibs --cargo-tree

  ffi-stability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      # uniffi-bindgen 0.32.x is required by scripts/generate-uniffi-kotlin.sh.
      - run: cargo install uniffi --version 0.32.0 --features cli --locked
      # Warm the cargo registry from Cargo.lock so the --offline regeneration
      # build below is deterministic on a fresh runner.
      - run: cargo fetch --locked
      - run: sh scripts/check-ffi-stability.sh --offline
